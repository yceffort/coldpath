name: coldpath report
description: Compare a pull request build with its base branch, enforce byte budgets, and keep one sticky PR comment.
branding:
  icon: bar-chart-2
  color: blue
inputs:
  args:
    description: Analyzer options for this build, one argument per line, without output options. Paths are relative to working-directory.
    required: true
  working-directory:
    description: Directory of the pull request build.
    default: .
  base-directory:
    description: Checkout of the base branch. The same args run there to produce the baseline report.
    default: ''
  baseline:
    description: An existing baseline report JSON (for example, downloaded from the base branch), used when base-directory is empty.
    default: ''
  max-added-bytes:
    description: Fail when generated bytes grow by more than this over the baseline.
    default: ''
  max-added-unobserved-bytes:
    description: Fail when unobserved bytes in --initial-scenario grow by more than this over the baseline.
    default: ''
  comment:
    description: Create or update one pull request comment with the Markdown summary.
    default: 'true'
  github-token:
    description: Token used to write the comment.
    default: ${{ github.token }}
  artifact-name:
    description: Name of the uploaded artifact with the report JSON, Markdown summary, and HTML treemap.
    default: coldpath-report
  analyzer:
    description: Where the analyzer comes from. `source` builds it with cargo, `npm` downloads the prebuilt binary published on npm, and any other value is the path of an analyzer binary.
    default: source
  analyzer-version:
    description: The published version to download when `analyzer` is `npm`. Defaults to this action's version.
    default: ''
outputs:
  exit-code:
    description: Analyzer exit code (0 success, 2 budget exceeded).
    value: ${{ steps.analyze.outputs.exit-code }}
  report:
    description: Path to the pull request report JSON.
    value: ${{ steps.analyze.outputs.report }}
runs:
  using: composite
  steps:
    - name: Provide the analyzer
      id: analyzer
      shell: bash
      env:
        INPUT_ANALYZER: ${{ inputs.analyzer }}
        INPUT_ANALYZER_VERSION: ${{ inputs.analyzer-version }}
      run: bash "$GITHUB_ACTION_PATH/action/analyzer.sh"
    - name: Analyze
      id: analyze
      shell: bash
      env:
        ANALYZER: ${{ steps.analyzer.outputs.path }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_BASE_DIRECTORY: ${{ inputs.base-directory }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_MAX_ADDED_BYTES: ${{ inputs.max-added-bytes }}
        INPUT_MAX_ADDED_UNOBSERVED_BYTES: ${{ inputs.max-added-unobserved-bytes }}
      run: bash "$GITHUB_ACTION_PATH/action/analyze.sh"
    - name: Upload the report
      id: upload
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/coldpath/out
    - name: Comment on the pull request
      if: inputs.comment == 'true' && github.event.pull_request.number
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPOSITORY: ${{ github.repository }}
        PULL_REQUEST: ${{ github.event.pull_request.number }}
        ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        EXIT_CODE: ${{ steps.analyze.outputs.exit-code }}
      run: bash "$GITHUB_ACTION_PATH/action/comment.sh"
    - name: Enforce budgets
      shell: bash
      run: exit "${{ steps.analyze.outputs.exit-code }}"
