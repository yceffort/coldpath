name: PR report

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-report-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report:
    name: Compare with the base branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      # This repository's recorded example stands in for a real build.
      - uses: ./
        with:
          base-directory: base
          args: |
            --dir
            examples/recorded
            --coverage
            examples/recorded/initial.coverage.json
            --coverage
            examples/recorded/interaction.coverage.json
            --initial-scenario
            initial
          max-added-bytes: 1024
          max-added-unobserved-bytes: 1024

  prebuilt:
    name: Analyze with the prebuilt analyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # The latest release: a release commit's own version is published only after its tag.
      - id: release
        run: echo "version=$(npm view @yceffort/coldpath version)" >> "$GITHUB_OUTPUT"
      - uses: ./
        with:
          analyzer: npm
          analyzer-version: ${{ steps.release.outputs.version }}
          args: |
            --dir
            examples/recorded
            --coverage
            examples/recorded/initial.coverage.json
            --coverage
            examples/recorded/interaction.coverage.json
            --initial-scenario
            initial
          comment: 'false'
          artifact-name: coldpath-report-prebuilt
