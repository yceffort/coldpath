name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  analyzer:
    name: Analyzer (${{ matrix.platform }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-latest
          - platform: darwin-x64
            os: macos-15-intel
          # The oldest supported runners keep the glibc requirement low.
          - platform: linux-x64
            os: ubuntu-22.04
          - platform: linux-arm64
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: cargo test --locked --release
      - run: cargo build --locked --release
      - run: node scripts/pack-native.ts --binary target/release/coldpath --out dist
      - run: test "$(ls dist/yceffort-coldpath-${{ matrix.platform }}-*.tgz)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: analyzer-${{ matrix.platform }}
          path: dist/*.tgz
          if-no-files-found: error

  publish:
    needs: analyzer
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      # prepack compiles bin/ and lib/ with TypeScript. Install before release-manifest edits package.json,
      # which the frozen lockfile would no longer match.
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - run: node scripts/release-manifest.ts "$GITHUB_REF_NAME"
      # Platform packages first: the main package's optionalDependencies must resolve when it appears.
      # The ./ prefix keeps npm from reading dist/<name>.tgz as a GitHub user/repo shorthand.
      # npm trusted publishing: authenticated by this job's OIDC token (id-token: write), no npm token.
      # Versions already on npm are skipped so a failed release can be re-run from its tag.
      - run: |
          for tarball in ./dist/*.tgz; do
            name=$(tar -xOzf "$tarball" package/package.json | node -p 'const p = JSON.parse(require("fs").readFileSync(0)); `${p.name}@${p.version}`')
            if npm view "$name" version >/dev/null 2>&1; then echo "skip $name"; else npm publish "$tarball" --access public --provenance; fi
          done
      - run: npm publish --access public --provenance
      - run: gh release create "$GITHUB_REF_NAME" dist/*.tgz --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
