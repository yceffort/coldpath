[package]
name = "coldpath"
version = "0.6.1"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"
description = "Trace JavaScript bundle bytes to original sources with source maps and V8 coverage"
authors = ["yceffort"]
repository = "https://github.com/yceffort/coldpath"
homepage = "https://github.com/yceffort/coldpath"
readme = "README.md"
keywords = ["javascript", "sourcemap", "coverage", "bundle", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
base64 = "0.22"
brotli = "8"
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
glob = "0.3"
globset = "0.4"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sourcemap = "9"

[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[profile.release]
lto = "thin"
strip = true

[workspace]
